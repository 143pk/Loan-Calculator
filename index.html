    <script type="application/ld+json">

      "@context": "https://schema.org",

      "mainEntity": [
        {
          "@type": "Question",
          "name": "How is a loan monthly payment calculated?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Monthly loan payments are calculated using the formula: P = [r * A] / [1 - (1 + r)^(-n)], where P is monthly payment, A is principal loan amount, r is monthly interest rate (annual percentage rate / 12), and n is total number of monthly payments."
          }
        },
        {
          "@type": "Question",
          "name": "How much can I save by making extra principal payments?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Making extra monthly or lump-sum principal payments directly reduces the outstanding loan balance, lowering future compound interest charges and shortening your total repayment term significantly."
          }
        },
        {
          "@type": "Question",
          "name": "What is an amortization schedule?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An amortization schedule is a complete table showing every periodic loan payment over time, detailing how much goes toward principal versus interest and the remaining loan balance after each payment."
          }
        }
      ]
    }
